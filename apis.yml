aid: kennek
name: Kennek
description: 'Kennek (Kennek Solutions Ltd) is a UK-based fintech providing all-in-one loan
  management software built for specialist bridge and development lenders. The platform lets
  lenders originate, manage, and service loans while monitoring funding lines in one place,
  automating manual workflows, covenant and eligibility calculations, portfolio risk visibility,
  and investor reporting so lending teams can scale without adding headcount. Founded by former
  lenders and backed by HV Capital, Kennek is surfaced in the API Evangelist network as a
  fintech portfolio-company profile; it publishes a marketing site and legal pages but no
  public developer portal, API documentation, or SDKs at this time.'
